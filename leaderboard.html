<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Learnify Elite Leaderboard</title>
  <meta name="description" content="Compare progress, streaks, and lecture completion with the global and friends-only leaderboard in Learnify Elite.">
  <meta name="robots" content="noindex, nofollow">
  <meta name="theme-color" content="#0f172a">
  <link rel="canonical" href="https://learnify-elite.vercel.app/leaderboard.html">
  <link rel="manifest" href="site.webmanifest">
  <meta property="og:type" content="website">
  <meta property="og:site_name" content="Learnify Elite">
  <meta property="og:title" content="Learnify Elite Leaderboard">
  <meta property="og:description" content="Track competitive study progress, completion rate, and streak momentum in Learnify Elite.">
  <meta property="og:url" content="https://learnify-elite.vercel.app/leaderboard.html">
  <meta property="og:image" content="https://learnify-elite.vercel.app/favicon.png">
  <link rel="icon" href="favicon.png" type="image/png">
  <link rel="apple-touch-icon" href="favicon.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;700&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
</head>
<body data-page="leaderboard">
  <div class="app-shell">
    <header class="app-header view">
      <div class="app-brand">
        <span class="eyebrow">Learnify Elite</span>
        <strong>Learnify Elite</strong>
      </div>
      <nav class="app-nav" aria-label="Primary"></nav>
      <div class="app-user-bar">
        <p id="welcome-text" class="muted-text"></p>
        <button id="logout-button" class="ghost-button danger" type="button">Log Out</button>
      </div>
    </header>

    <section class="view page-view">
      <header class="topbar">
        <div>
          <span class="eyebrow">Leaderboard</span>
          <h2>Compare real progress</h2>
          <p class="muted-text">Switch between the global board and your private friends-only ranking.</p>
        </div>
      </header>

      <section class="page-panel competition-card">
        <div class="competition-heading">
          <div>
            <span class="eyebrow">Ranking</span>
            <h4>Performance board</h4>
          </div>
          <span id="leaderboard-count" class="status-pill">0 learners</span>
        </div>

        <div class="leaderboard-scope-toggle">
          <button id="leaderboard-global" class="ghost-button active" type="button">Global</button>
          <button id="leaderboard-friends" class="ghost-button" type="button">Friends</button>
        </div>

        <p id="rivalry-copy" class="muted-text rivalry-copy">Compare progress percentage, completed lectures, and streaks.</p>
        <div id="leaderboard-list" class="leaderboard-list"></div>
      </section>

      <section class="page-panel competition-card section-spaced">
        <div class="competition-heading">
          <div>
            <span class="eyebrow">Subject Comparison</span>
            <h4>Your subject split</h4>
          </div>
        </div>
        <div id="leaderboard-subject-compare" class="comparison-stack"></div>
      </section>
    </section>

    <nav class="mobile-nav" aria-label="Mobile Primary"></nav>
  </div>

  <script src="analytics.js"></script>
  <script src="app.js"></script>
</body>
</html>
