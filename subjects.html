<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Learnify Elite Subjects</title>
  <meta name="description" content="Browse subjects, compare subject-wise progress, and manage syllabus coverage inside Learnify Elite.">
  <meta name="robots" content="noindex, nofollow">
  <meta name="theme-color" content="#0f172a">
  <link rel="canonical" href="https://learnify-elite.vercel.app/subjects.html">
  <link rel="manifest" href="site.webmanifest">
  <meta property="og:type" content="website">
  <meta property="og:site_name" content="Learnify Elite">
  <meta property="og:title" content="Learnify Elite Subjects">
  <meta property="og:description" content="Review subjects and syllabus sections with progress-focused study tracking in Learnify Elite.">
  <meta property="og:url" content="https://learnify-elite.vercel.app/subjects.html">
  <meta property="og:image" content="https://learnify-elite.vercel.app/favicon.png">
  <link rel="icon" href="favicon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="favicon.png">
  <link rel="preconnect" href="https://learnify-pro.onrender.com" crossorigin>
  <link rel="preload" href="app.js" as="script">
  <link rel="stylesheet" href="styles.css">
</head>
<body data-page="subjects">
  <div data-barba="wrapper">
  <div class="app-shell" data-barba="container" data-barba-namespace="subjects" data-page="subjects">
    <header class="app-header view">
      <div class="app-brand">
        <span class="eyebrow">Learnify Elite</span>
        <strong>Learnify Elite</strong>
      </div>
      <nav class="app-nav" aria-label="Primary"></nav>
      <div class="app-user-bar">
        <p id="welcome-text" class="muted-text"></p>
        <button id="logout-button" class="ghost-button danger" type="button">Log Out</button>
      </div>
    </header>

    <section class="view page-view">
      <header class="topbar">
        <div>
          <span class="eyebrow">Subjects</span>
          <h2>Study by syllabus area</h2>
          <p class="muted-text">Subjects stay separate from the dashboard so planning and lecture execution each have a focused space.</p>
        </div>
      </header>

      <section class="page-panel">
        <div class="section-heading">
          <div>
            <span class="eyebrow">Subjects</span>
            <h3>Choose a subject to open its lectures</h3>
          </div>
        </div>
        <div id="subjects-grid" class="subjects-grid"></div>
        <section class="section-spaced">
          <div class="section-heading">
            <div>
              <span class="eyebrow">Revision Layer</span>
              <h3>Subject revision notebook</h3>
            </div>
          </div>
          <div id="subject-notes-grid" class="subject-notes-grid"></div>
        </section>
      </section>
    </section>

    <nav class="mobile-nav" aria-label="Mobile Primary"></nav>
  </div>
  </div>
  <script src="analytics.js" defer></script>
  <script src="app.js" defer></script>
</body>
</html>
