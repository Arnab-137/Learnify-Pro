<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Learnify Elite | Study Tracker for Lectures, Progress & Focus Sessions</title>
  <meta name="description" content="Learnify Elite is a modern study tracker for lecture-based preparation. Track syllabus completion, manage subjects, stay consistent, and focus on the next lecture that matters.">
  <meta name="robots" content="index, follow, max-image-preview:large">
  <meta name="theme-color" content="#0f172a">
  <meta name="application-name" content="Learnify Elite">
  <link rel="canonical" href="https://learnify-elite.vercel.app/">
  <link rel="manifest" href="site.webmanifest">
  <meta property="og:type" content="website">
  <meta property="og:site_name" content="Learnify Elite">
  <meta property="og:title" content="Learnify Elite | Study Tracker for Lectures, Progress & Focus Sessions">
  <meta property="og:description" content="Track lectures, syllabus completion, study streaks, and focus sessions in one clean productivity workspace.">
  <meta property="og:url" content="https://learnify-elite.vercel.app/">
  <meta property="og:image" content="https://learnify-elite.vercel.app/favicon.png">
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:title" content="Learnify Elite | Study Tracker for Lectures, Progress & Focus Sessions">
  <meta name="twitter:description" content="Track lectures, syllabus completion, study streaks, and focus sessions in one clean productivity workspace.">
  <meta name="twitter:image" content="https://learnify-elite.vercel.app/favicon.png">
  <link rel="icon" href="favicon.png" type="image/png">
  <link rel="apple-touch-icon" href="favicon.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;700&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
  <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "SoftwareApplication",
      "name": "Learnify Elite",
      "applicationCategory": "EducationalApplication",
      "operatingSystem": "Web",
      "url": "https://learnify-elite.vercel.app/",
      "description": "A web-based study tracker for lecture planning, syllabus completion, progress monitoring, and focused study sessions.",
      "image": "https://learnify-elite.vercel.app/favicon.png"
    }
  </script>
</head>
<body data-page="auth">
  <div class="app-shell">
    <section class="view auth-view">
      <div class="auth-layout">
        <div class="hero-panel">
          <span class="eyebrow">Learnify Elite</span>
          <h1>Track every lecture, subject, and milestone in one focused workspace.</h1>
          <p>Stay accountable with private progress, clean subject cards, and instant completion stats.</p>
          <div class="hero-badges">
            <span>Private progress</span>
            <span>Subject analytics</span>
            <span>Responsive design</span>
          </div>
        </div>
        <div class="auth-card">
          <div class="auth-tabs">
            <button class="tab-button active" data-mode="login" type="button">Log In</button>
            <button class="tab-button" data-mode="signup" type="button">Sign Up</button>
          </div>
          <form id="auth-form" class="auth-form">
            <label id="auth-name-field" class="hidden">
              <span>Name</span>
              <input id="auth-name" type="text" placeholder="Your name">
            </label>
            <label>
              <span>Email</span>
              <input id="auth-email" type="email" placeholder="you@example.com" required>
            </label>
            <label>
              <span>Password</span>
              <input id="auth-password" type="password" placeholder="Enter password" minlength="6" required>
            </label>
            <button id="auth-submit" class="primary-button" type="submit">Log In</button>
          </form>
          <p id="auth-message" class="status-text"></p>
          <div class="auth-footer-note">
            <span>Focused planning</span>
            <span>Daily momentum</span>
            <span>Private tracking</span>
          </div>
        </div>
      </div>
    </section>
  </div>

  <script src="analytics.js"></script>
  <script src="app.js"></script>
</body>
</html>
