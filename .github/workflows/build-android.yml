name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "android/**"
      - "scripts/build-mobile.js"
      - "capacitor.config.json"
      - "package.json"
      - "package-lock.json"
      - "*.html"
      - "*.css"
      - "*.js"
      - "favicon.*"

permissions:
  contents: read

jobs:
  build-apk:
    name: Compile installable APK
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: gradle

      - name: Install dependencies
        run: npm ci

      - name: Sync the current website into Android
        run: npm run mobile:sync

      - name: Generate branded Android icons
        run: npm run mobile:assets

      - name: Build test APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Upload Learnify Elite APK
        uses: actions/upload-artifact@v4
        with:
          name: Learnify-Elite-Android
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30
